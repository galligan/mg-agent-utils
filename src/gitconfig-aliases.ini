[alias]
  # Super Duper Add & Stage alias
  sda = "!f() { \
    git add \"$@\" && \
    echo '=== 🚦 REPOSITORY STATUS AFTER ADD ==='; \
    git status --short | cat; \
    echo '\n=== 🔵 STAGED CHANGES ==='; \
    git diff --staged --color | cat; \
  }; f"

  # Conventional commit with description from file (auto-removes the file)
  sdc = "!f() { \
    RED=\"\\033[0;31m\"; \
    GREEN=\"\\033[0;32m\"; \
    YELLOW=\"\\033[0;33m\"; \
    NC=\"\\033[0m\"; \
    COMMIT_TITLE=\"$1\"; \
    DESC_FILE=\"$2\"; \
    LINE_BREAK='=============================================================='; \
    SUB_BREAK='~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~'; \
    if [ -z \"$COMMIT_TITLE\" ]; then \
      echo \"${RED}❌ ERROR: No commit message provided${NC}\"; \
      echo \"$LINE_BREAK\"; \
      echo \"📝 Usage: git cm \\\"type(scope): description\\\" [description-file (optional for multi-line)]\"; \
      echo \"👉 Example: git cm \\\"feat(auth): add login button\\\" COMMIT_DESC.tmp\"; \
      return 1; \
    fi; \
    COMMIT_LENGTH=${#COMMIT_TITLE}; \
    if [ $COMMIT_LENGTH -gt 70 ]; then \
      echo \"${RED}❌ ERROR: Commit message is too long (${COMMIT_LENGTH} chars)${NC}\"; \
      echo \"$LINE_BREAK\"; \
      echo \"📏 Rule: Commit title should be 70 characters or less\"; \
      echo \"💡 Suggestion: Shorten title or include a temp file for more lines e.g. (COMMIT_DESC.tmp):\"; \
      echo \"👉 git cm \\\"type(scope): description\\\" COMMIT_DESC.tmp\"; \
      return 1; \
    fi; \
    COMMIT_REGEX='^(feat|fix|docs|style|refactor|test|chore|perf|build|ci|revert|hotfix|release)(\\([a-z0-9-]+\\))?: .+$'; \
    if ! [[ $COMMIT_TITLE =~ $COMMIT_REGEX ]]; then \
      echo \"${RED}❌ ERROR: Commit message does not follow conventional commits${NC}\"; \
      echo \"$LINE_BREAK\"; \
      echo \"📝 Format: type(scope): description\"; \
      echo \"👉 Examples: \\\"feat(auth): add login button\\\", \\\"fix: resolve null pointer exception\\\"\"; \
      echo \"✅ Valid types: feat, fix, docs, style, refactor, test, chore, perf, build, ci, revert, hotfix, release\"; \
      return 1; \
    fi; \
    if [ -n \"$DESC_FILE\" ] && [ -f \"$DESC_FILE\" ]; then \
      printf \"%s\\n\\n\" \"$COMMIT_TITLE\" > .git/COMMIT_EDITMSG; \
      cat \"$DESC_FILE\" >> .git/COMMIT_EDITMSG; \
      git commit -F .git/COMMIT_EDITMSG; \
      COMMIT_STATUS=$?; \
      if [ $COMMIT_STATUS -eq 0 ]; then \
        COMMIT_HASH=$(git rev-parse --short HEAD); \
        echo \"${GREEN}✅ Commit successful! Created commit $COMMIT_HASH${NC}\"; \
        echo \"$LINE_BREAK\"; \
        echo \"📝 Message: $COMMIT_TITLE\"; \
        echo \"$SUB_BREAK\"; \
        echo \"🔄 Files changed:\"; \
        echo \"$(git diff --stat HEAD~1 HEAD | grep -v 'files changed' | sed 's/^  / /')\"; \
        echo \"$SUB_BREAK\"; \
        rm \"$DESC_FILE\"; \
        echo \"🗑️  Temporary description file '$DESC_FILE' has been removed.\"; \
      else \
        echo \"${RED}❌ Commit failed!${NC}\"; \
        echo \"$LINE_BREAK\"; \
        echo \"📄 Temporary file '$DESC_FILE' was preserved.\"; \
      fi; \
      return $COMMIT_STATUS; \
    else \
      if [ -n \"$DESC_FILE\" ]; then \
        echo \"${YELLOW}⚠️ \\\"$DESC_FILE\\\" not found. Multiline commit description wasn't included.${NC}\"; \
      fi; \
      git commit -m \"$COMMIT_TITLE\"; \
      COMMIT_STATUS=$?; \
      if [ $COMMIT_STATUS -eq 0 ]; then \
        COMMIT_HASH=$(git rev-parse --short HEAD); \
        echo \"${GREEN}✅ Commit successful! Created commit $COMMIT_HASH${NC}\"; \
        echo \"$LINE_BREAK\"; \
        echo \"📝 Message: $COMMIT_TITLE\"; \
        echo \"$SUB_BREAK\"; \
        echo \"🔄 Files changed:\"; \
        echo \"$(git diff --stat HEAD~1 HEAD | grep -v 'files changed' | sed 's/^  / /')\"; \
        if [ -n \"$DESC_FILE\" ]; then \
          echo \"$SUB_BREAK\"; \
          echo \"${YELLOW}⚠️ \\\"$DESC_FILE\\\" not found. Multiline commit description wasn't included.${NC}\"; \
        fi; \
      else \
        echo \"${RED}❌ Commit failed!${NC}\"; \
        echo \"$LINE_BREAK\"; \
        echo \"Please check your repository status and try again.\"; \
      fi; \
      return $COMMIT_STATUS; \
    fi; \
  }; f"

  # Split commit with multiple messages and files
  sdsc = "!f() { \
    RED=\"\\033[0;31m\"; \
    GREEN=\"\\033[0;32m\"; \
    YELLOW=\"\\033[0;33m\"; \
    BLUE=\"\\033[0;34m\"; \
    CYAN=\"\\033[0;36m\"; \
    NC=\"\\033[0m\"; \
    LINE_BREAK='========================================='; \
    SUB_BREAK='~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~'; \
    COMMIT_REGEX='^(feat|fix|docs|style|refactor|test|chore|perf|build|ci|revert|hotfix|release)(\\([a-z0-9-]+\\))?: .+$'; \
    TOTAL_COMMITS=0; \
    TOTAL_FILES=0; \
    TOTAL_INSERTIONS=0; \
    TOTAL_DELETIONS=0; \
    if [ $# -lt 2 ] || [ $(($# % 2)) -ne 0 ]; then \
      echo \"${RED}❌ ERROR: Incorrect number of arguments${NC}\"; \
      echo \"$LINE_BREAK\"; \
      echo \"📝 Usage: git scm \\\"<files-or-pattern-1>\\\" \\\"<message-1>\\\" [\\\"<files-or-pattern-2>\\\" \\\"<message-2>\\\" ...]\\\"; \
      echo \"$SUB_BREAK\"; \
      echo \"👉 Examples:\"; \
      echo \"  ${YELLOW}Specific files + Pattern:${NC}\"; \
      echo \"    git scm \\\"file-a1.js file-a2.js\\\" \\\"feat(ui): update components\\\" \\\"*.css\\\" \\\"style: update stylesheets\\\"\"; \
      echo \"  ${YELLOW}Multiple commit groups:${NC}\"; \
      echo \"    git scm \\\"package.json\\\" \\\"build(deps): update dependencies\\\" \\\"src/*.js\\\" \\\"feat: new features\\\" \\\"*.md\\\" \\\"docs: update documentation\\\"\"; \
      return 1; \
    fi; \
    VALID_MSGS=true; \
    i=2; \
    while [ $i -le $# ]; do \
      msg_var_name=$i; \
      msg=${!msg_var_name}; \
      if ! [[ $msg =~ $COMMIT_REGEX ]]; then \
        echo \"${RED}❌ ERROR: Commit message does not follow conventional commits${NC}\"; \
        echo \"$LINE_BREAK\"; \
        echo \"${YELLOW}Problematic message (#$((i/2))):${NC} $msg\"; \
        echo \"📝 Format: type(scope): description\"; \
        echo \"👉 Examples: \\\"feat(auth): add login button\\\", \\\"fix: resolve null pointer exception\\\"\"; \
        echo \"✅ Valid types: feat, fix, docs, style, refactor, test, chore, perf, build, ci, revert, hotfix, release\"; \
        return 1; \
      fi; \
      i=$((i+2)); \
    done; \
    echo \"\"; \
    echo \"$LINE_BREAK\"; \
    echo \"        ✨ GIT SPLIT COMMIT ✨\"; \
    echo \"$LINE_BREAK\"; \
    echo \"\"; \
    echo \"${YELLOW}⚠️  WARNING: This command will SOFT reset your last commit (HEAD~1)${NC}\"; \
    echo \"$SUB_BREAK\"; \
    echo \"${BLUE}🔍 Last commit to be split:${NC}\"; \
    git log -1 --pretty=format:\"%h - %s (%an, %ar)\" HEAD; \
    echo \"\"; \
    echo \"${YELLOW}$SUB_BREAK${NC}\"; \
    echo -n \"${YELLOW}⚠️  Continue? [y/N] ${NC}\"; \
    read answer; \
    if ! [[ \"$answer\" =~ ^[Yy]$ ]]; then \
      echo \"${RED}❌ Operation cancelled${NC}\"; \
      return 1; \
    fi; \
    echo \"\"; \
    echo \"↩️  Performing soft reset (git reset HEAD~1)\"; \
    echo \"$LINE_BREAK\"; \
    git reset HEAD~1; \
    RESET_STATUS=$?; \
    if [ $RESET_STATUS -ne 0 ]; then \
      echo \"${RED}❌ Reset failed! Cannot continue.${NC}\"; \
      echo \"${YELLOW}Attempting to restore original commit...${NC}\"; \
      git reset --hard HEAD@{1} > /dev/null 2>&1; \
      return 1; \
    fi; \
    echo \"✅ Reset successful. Staging area contains changes from the last commit.\"; \
    echo \"\"; \
    ARGS_LEFT=$#; \
    COMMIT_COUNT=0; \
    while [ $# -ge 2 ]; do \
      files_pattern=$1; \
      message=$2; \
      COMMIT_COUNT=$((COMMIT_COUNT+1)); \
      echo \"🔵 Processing Commit #${COMMIT_COUNT}: ${CYAN}$message${NC}\"; \
      echo \"$SUB_BREAK\"; \
      echo \"🔄 Unstaging all changes...\"; \
      git reset HEAD . > /dev/null; \
      echo \"🚦 Staging files/pattern: ${CYAN}$files_pattern${NC}\"; \
      echo $files_pattern | xargs git add; \
      ADD_STATUS=$?; \
      if [ $ADD_STATUS -ne 0 ]; then \
        echo \"${RED}❌ Failed to stage files for pattern: $files_pattern${NC}\"; \
        echo \"${YELLOW}⚠️  Skipping this commit and continuing...${NC}\"; \
        shift 2; \
        continue; \
      fi; \
      if git diff --staged --quiet; then \
          echo \"${YELLOW}⚠️ No changes staged for pattern '$files_pattern'. Skipping commit.${NC}\"; \
          shift 2; \
          continue; \
      fi; \
      echo \"🚀 Committing staged changes...\"; \
      git commit -m \"$message\" --no-verify; \
      COMMIT_STATUS=$?; \
      if [ $COMMIT_STATUS -eq 0 ]; then \
        TOTAL_COMMITS=$((TOTAL_COMMITS+1)); \
        COMMIT_HASH=$(git rev-parse --short HEAD); \
        BRANCH=$(git rev-parse --abbrev-ref HEAD); \
        COMMIT_FILES=$(git diff --name-only HEAD~1 HEAD | wc -l | tr -d ' ' || echo '0'); \
        COMMIT_STATS=$(git diff --shortstat HEAD~1 HEAD); \
        INSERTIONS=$(echo \"$COMMIT_STATS\" | grep -o '[0-9]\\+ insertion' | awk '{print $1}' || echo '0'); \
        DELETIONS=$(echo \"$COMMIT_STATS\" | grep -o '[0-9]\\+ deletion' | awk '{print $1}' || echo '0'); \
        TOTAL_FILES=$((TOTAL_FILES+COMMIT_FILES)); \
        TOTAL_INSERTIONS=$((TOTAL_INSERTIONS+INSERTIONS)); \
        TOTAL_DELETIONS=$((TOTAL_DELETIONS+DELETIONS)); \
        echo \"${GREEN}✅ Commit successful!${NC}\"; \
        echo \"   Hash: ${COMMIT_HASH}\"; \
        echo \"   Branch: ${BRANCH}\"; \
        echo \"   Message: ${message}\"; \
        if [ -z \"$COMMIT_STATS\" ] || [ \"$COMMIT_FILES\" -eq 0 ]; then \
          echo \"   Stats: No file changes detected in commit (check staging).\" ; \
        else \
          echo \"   Stats: ${COMMIT_FILES} files changed, ${GREEN}${INSERTIONS}(+)${NC}, ${RED}${DELETIONS}(-)${NC}\"; \
        fi; \
      else \
        echo \"${RED}❌ Commit failed!${NC}\"; \
        echo \"${YELLOW}⚠️  Changes for '$files_pattern' might still be staged.${NC}\"; \
        echo \"${YELLOW}⚠️  Continuing with remaining commits...${NC}\"; \
      fi; \
      shift 2; \
      if [ $# -ge 2 ]; then \
        echo \"\"; \
        echo \"$SUB_BREAK\"; \
      fi; \
    done; \
    echo \"\"; \
    echo \"$LINE_BREAK\"; \
    echo \"        ✅ SPLIT COMPLETE ✅\"; \
    echo \"$LINE_BREAK\"; \
    REMAINING=$(git status --short | wc -l | tr -d ' '); \
    BRANCH=$(git rev-parse --abbrev-ref HEAD); \
    REMOTE_INFO=\"\"; \
    if git rev-parse --abbrev-ref --symbolic-full-name @{u} > /dev/null 2>&1; then \
        COMMITS_AHEAD=$(git rev-list --count @{u}..HEAD); \
        COMMITS_BEHIND=$(git rev-list --count HEAD..@{u}); \
        REMOTE_INFO=\"(${COMMITS_AHEAD} ahead, ${COMMITS_BEHIND} behind upstream)\"; \
    else \
        REMOTE_INFO=\"(upstream branch not configured or found)\"; \
    fi; \
    echo \"📊 Summary:\"; \
    echo \"$SUB_BREAK\"; \
    echo \"   🧩 Split into: ${TOTAL_COMMITS} successful commits (out of ${COMMIT_COUNT} attempts)\"; \
    echo \"   📂 Total changes committed: ${TOTAL_FILES} files, ${GREEN}${TOTAL_INSERTIONS} insertions(+)${NC}, ${RED}${TOTAL_DELETIONS} deletions(-)${NC}\"; \
    echo \"   🌿 Current Branch: ${BRANCH} ${REMOTE_INFO}\"; \
    if [ $REMAINING -gt 0 ]; then \
      echo \"${YELLOW}⚠️  Remaining uncommitted changes detected:${NC}\"; \
      git status --short | cat; \
    else \
      echo \"${GREEN}🎉 All specified changes appear to have been committed successfully!${NC}\"; \
    fi; \
    echo \"$LINE_BREAK\"; \
  }; f"
  
  # Super Duper Diff: Display status, diff, and staged diff
  sd-diff = "!f() { \
    LINE_BREAK='========================================='; \
    SUB_BREAK='~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~'; \
    STAGED_CHANGES=$(git diff --staged --name-only | wc -l | tr -d ' '); \
    UNSTAGED_CHANGES=$(git diff --name-only | wc -l | tr -d ' '); \
    UNTRACKED_CHANGES=$(git ls-files --others --exclude-standard | wc -l | tr -d ' '); \
    BRANCH=$(git rev-parse --abbrev-ref HEAD); \
    COMMITS_AHEAD=$(git rev-list --count @{u}..HEAD 2>/dev/null || echo 0); \
    COMMITS_BEHIND=$(git rev-list --count HEAD..@{u} 2>/dev/null || echo 0); \
    echo ''; \
    echo $LINE_BREAK; \
    echo '         ✨ SUPER DUPER DIFF ✨'; \
    echo $LINE_BREAK; \
    echo ''; \
    echo 'ℹ️  Branch Info:'; \
    echo $SUB_BREAK; \
    git branch -vv; \
    echo ''; \
    echo '🟦 Staged Changes:'; \
    echo $SUB_BREAK; \
    git diff --staged | sed 's/^/ /'; \
    echo ''; \
    echo '🟨 Unstaged Changes:'; \
    echo $SUB_BREAK; \
    git diff --stat | sed 's/^/ /'; \
    echo ''; \
    echo '📊 Super Diff Summary:'; \
    echo $SUB_BREAK; \
    echo \"🌿 Branch: $BRANCH\"; \
    echo \"📦 Changes: $STAGED_CHANGES staged, $UNSTAGED_CHANGES unstaged, $UNTRACKED_CHANGES untracked\"; \
    echo \"🔄 Commits: $COMMITS_AHEAD ahead, $COMMITS_BEHIND behind\"; \
  }; f"

  # Super Duper Status: Display status, recent commits, and staged changes with branch analysis
  sd-status = "!f() { \
    HISTORY_DEPTH=10; \
    if [ -n \"$1\" ] && [ \"$1\" -eq \"$1\" ] 2>/dev/null; then \
        HISTORY_DEPTH=$1; \
    fi; \
    MAIN_BRANCH=\"main\"; \
    DEV_BRANCH=\"dev\"; \
    LINE_BREAK='========================================='; \
    SUB_BREAK='~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~'; \
    GREEN=\"\\033[0;32m\"; \
    YELLOW=\"\\033[0;33m\"; \
    RED=\"\\033[0;31m\"; \
    RESET=\"\\033[0m\"; \
    STAGED_CHANGES=$(git diff --staged --name-only | wc -l | tr -d ' '); \
    UNSTAGED_CHANGES=$(git diff --name-only | wc -l | tr -d ' '); \
    UNTRACKED_CHANGES=$(git ls-files --others --exclude-standard | wc -l | tr -d ' '); \
    COMMITS_AHEAD=$(git rev-list --count @{u}..HEAD 2>/dev/null || echo 0); \
    COMMITS_BEHIND=$(git rev-list --count HEAD..@{u} 2>/dev/null || echo 0); \
    CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD); \
    CURRENT_COMMIT=$(git rev-parse HEAD); \
    MAIN_COMMIT=$(git rev-parse $MAIN_BRANCH 2>/dev/null || git rev-parse master 2>/dev/null); \
    if [ -z \"$MAIN_COMMIT\" ]; then MAIN_COMMIT=$(git rev-parse master); MAIN_BRANCH=\"master\"; fi; \
    DEV_COMMIT=$(git rev-parse $DEV_BRANCH 2>/dev/null || echo \"\"); \
    echo ''; \
    echo $LINE_BREAK; \
    echo '        ✨ SUPER DUPER STATUS ✨'; \
    echo $LINE_BREAK; \
    echo ''; \
    echo 'ℹ️  Branch Info:'; \
    echo $SUB_BREAK; \
    git branch -vv; \
    echo ''; \
    if [ \"$HISTORY_DEPTH\" -ne 10 ]; then \
      echo \"🕒 Recent Commits (showing $HISTORY_DEPTH)\"; \
    else \
      echo '🕒 Recent Commits'; \
    fi; \
    echo $SUB_BREAK; \
    git log --oneline --graph --all --decorate -n $HISTORY_DEPTH; \
    echo ''; \
    echo '📝 Last Commit Changes:'; \
    echo $SUB_BREAK; \
    git show --name-status --oneline HEAD | grep -v '^[0-9a-f]\\+ ' | sed 's/^/  /'; \
    echo ''; \
    if [ \"$STAGED_CHANGES\" -gt 0 ]; then \
      echo '🟦 Staged Changes:'; \
      echo $SUB_BREAK; \
      git diff --staged --stat | sed 's/^/ /'; \
      echo ''; \
    fi; \
    if [ \"$UNSTAGED_CHANGES\" -gt 0 ]; then \
      echo '🟨 Unstaged Changes:'; \
      echo $SUB_BREAK; \
      git diff --stat | sed 's/^/ /'; \
      echo ''; \
    fi; \
    if [ \"$UNTRACKED_CHANGES\" -gt 0 ]; then \
      echo '🔲 Untracked Files:'; \
      echo $SUB_BREAK; \
      git ls-files --others --exclude-standard | sed 's/^/  /'; \
      echo ''; \
    fi; \
    STASH_COUNT=$(git stash list | wc -l | tr -d ' '); \
    if [ "$STASH_COUNT" -gt 0 ]; then \
      echo '📦 Stashed Changes:'; \
      echo $SUB_BREAK; \
      git stash list | sed 's/^/  /'; \
      echo ''; \
    fi; \
    MERGE_CONFLICT_FILES=$(git diff --name-only --diff-filter=U | wc -l | tr -d ' '); \
    if [ \"$MERGE_CONFLICT_FILES\" -gt 0 ]; then \
      echo '⚠️  Merge Conflicts:'; \
      echo $SUB_BREAK; \
      echo \"  ${RED}$MERGE_CONFLICT_FILES files with merge conflicts:${RESET}\"; \
    git diff --name-only --diff-filter=U | sed 's/^/    /'; \
    echo ''; \
    fi; \
    echo '📊 Super Duper Status Summary:'; \
    echo $SUB_BREAK; \
    if [ -z \"$MAIN_COMMIT\" ]; then \
      echo \"🚨 Branch: [${RED}missing${RESET}] $MAIN_BRANCH\"; \
      echo \"👉 Suggestion: Create main branch first: git checkout -b $MAIN_BRANCH\"; \
    elif [ -z \"$DEV_COMMIT\" ]; then \
      if [ \"$CURRENT_BRANCH\" = \"$MAIN_BRANCH\" ]; then \
        echo \"🚨 Branch: [current] $MAIN_BRANCH\"; \
        echo \"👉 Suggestion: Create dev branch with: git checkout -b dev\"; \
      else \
        echo \"⚠️ Branch: [current] $CURRENT_BRANCH ← [${RED}missing${RESET}] dev ← $MAIN_BRANCH\"; \
        echo \"👉 Suggestion: Create dev branch with: git checkout $MAIN_BRANCH && git checkout -b dev\"; \
      fi; \
    else \
      BEHIND_AHEAD_DEV_MAIN=$(git rev-list --left-right --count $MAIN_BRANCH...$DEV_BRANCH); \
      MAIN_AHEAD=$(echo \"$BEHIND_AHEAD_DEV_MAIN\" | awk '{print $1}'); \
      DEV_AHEAD=$(echo \"$BEHIND_AHEAD_DEV_MAIN\" | awk '{print $2}'); \
      if [ \"$CURRENT_BRANCH\" = \"$MAIN_BRANCH\" ]; then \
        echo \"🚨 Branch: [current] $MAIN_BRANCH\"; \
        echo \"👉 Suggestion: Switch to dev or create a feature branch\"; \
      elif [ \"$CURRENT_BRANCH\" = \"$DEV_BRANCH\" ]; then \
        if [ \"$MAIN_AHEAD\" -gt 0 ]; then \
          echo \"⚠️ Branch: [current] $DEV_BRANCH [$([ $DEV_AHEAD -gt 0 ] && echo \"${GREEN}+$DEV_AHEAD${RESET}\" || echo \"+$DEV_AHEAD\") $([ $MAIN_AHEAD -gt 0 ] && echo \"${RED}-$MAIN_AHEAD${RESET}\" || echo \"-$MAIN_AHEAD\")] ← $MAIN_BRANCH\"; \
          echo \"👉 Suggestion: Update dev from main: git merge $MAIN_BRANCH\"; \
        else \
          echo \"🌿 Branch: [current] $DEV_BRANCH [$([ $DEV_AHEAD -gt 0 ] && echo \"${GREEN}+$DEV_AHEAD${RESET}\" || echo \"+$DEV_AHEAD\")] ← $MAIN_BRANCH\"; \
          echo \"👉 Suggestion: Create a feature branch for your work\"; \
        fi; \
      else \
        MERGE_BASE=$(git merge-base $CURRENT_BRANCH $DEV_BRANCH 2>/dev/null); \
        if [ \"$MERGE_BASE\" = \"$DEV_COMMIT\" ]; then \
          if [ \"$MAIN_AHEAD\" -gt 0 ]; then \
            echo \"🌿 Branch: [current] $CURRENT_BRANCH ← $DEV_BRANCH [$([ $DEV_AHEAD -gt 0 ] && echo \"${GREEN}+$DEV_AHEAD${RESET}\" || echo \"+$DEV_AHEAD\") $([ $MAIN_AHEAD -gt 0 ] && echo \"${RED}-$MAIN_AHEAD${RESET}\" || echo \"-$MAIN_AHEAD\")] ← $MAIN_BRANCH\"; \
            echo \"👉 Suggestion: Dev is behind main. Consider: git checkout dev && git merge $MAIN_BRANCH\"; \
          else \
            echo \"🌿 Branch: [current] $CURRENT_BRANCH ← $DEV_BRANCH [$([ $DEV_AHEAD -gt 0 ] && echo \"${GREEN}+$DEV_AHEAD${RESET}\" || echo \"+$DEV_AHEAD\")] ← $MAIN_BRANCH\"; \
          fi; \
        else \
          if [ \"$CURRENT_COMMIT\" = \"$MAIN_COMMIT\" ]; then \
            echo \"⚠️ Branch: [current] $CURRENT_BRANCH [${YELLOW}same commit${RESET}] ← $MAIN_BRANCH\"; \
            echo \"👉 Suggestion: Your branch is at the same commit as $MAIN_BRANCH. Consider rebasing from dev\"; \
          else \
            BEHIND_AHEAD=$(git rev-list --left-right --count $MAIN_BRANCH...$CURRENT_BRANCH); \
            BEHIND=$(echo \"$BEHIND_AHEAD\" | awk '{print $1}'); \
            AHEAD=$(echo \"$BEHIND_AHEAD\" | awk '{print $2}'); \
            echo \"⚠️ Branch: [current] $CURRENT_BRANCH [$([ $AHEAD -gt 0 ] && echo \"${GREEN}+$AHEAD${RESET}\" || echo \"+$AHEAD\") $([ $BEHIND -gt 0 ] && echo \"${RED}-$BEHIND${RESET}\" || echo \"-$BEHIND\")] ← $MAIN_BRANCH\"; \
            echo \"👉 Suggestion: Consider rebasing from dev\"; \
          fi; \
        fi; \
      fi; \
    fi; \
    echo \"🔄 Commits: $([ $COMMITS_AHEAD -gt 0 ] && echo \"${GREEN}$COMMITS_AHEAD ahead${RESET}\" || echo \"$COMMITS_AHEAD ahead\"), $([ $COMMITS_BEHIND -gt 0 ] && echo \"${RED}$COMMITS_BEHIND behind${RESET}\" || echo \"$COMMITS_BEHIND behind\")\"; \
    if [ \"$MERGE_CONFLICT_FILES\" -gt 0 ]; then \
      echo \"⛔ Conflicts: ${RED}$MERGE_CONFLICT_FILES files with merge conflicts${RESET}\"; \
    fi; \
    echo \"📦 Changes: $([ $STAGED_CHANGES -gt 0 ] && echo \"${GREEN}$STAGED_CHANGES ${GREEN}staged${RESET}\" || echo \"$STAGED_CHANGES staged\"), $([ $UNSTAGED_CHANGES -gt 0 ] && echo \"${YELLOW}$UNSTAGED_CHANGES ${YELLOW}unstaged${RESET}\" || echo \"$UNSTAGED_CHANGES unstaged\")$([ \"$STASH_COUNT\" -gt 0 ] && echo \", ${YELLOW}$STASH_COUNT ${YELLOW}stashed${RESET}\"), $([ $UNTRACKED_CHANGES -gt 0 ] && echo \"${RED}$UNTRACKED_CHANGES ${RED}untracked${RESET}\" || echo \"$UNTRACKED_CHANGES untracked\")\"; \
  }; f"

  # Simplified non-interactive sd-push function
  sd-push = "!f() { \
    CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD); \
    UPSTREAM=$(git config branch.$CURRENT_BRANCH.remote); \
    LINE_BREAK='========================================='; \
    SUB_BREAK='~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~'; \
    GREEN=\"\\033[0;32m\"; \
    YELLOW=\"\\033[0;33m\"; \
    RED=\"\\033[0;31m\"; \
    BLUE=\"\\033[0;34m\"; \
    BOLD=\"\\033[1m\"; \
    RESET=\"\\033[0m\"; \
    REMOTE=\"origin\"; \
    DEV_BRANCH=\"dev\"; \
    MAIN_BRANCH=\"main\"; \
    UNPUSHED_COMMITS=$(git log $REMOTE/$CURRENT_BRANCH..$CURRENT_BRANCH 2>/dev/null | grep -c \"^commit\"); \
    if [ $? -ne 0 ]; then \
      UNPUSHED_COMMITS=-1; \
    fi; \
    git ls-remote --heads $REMOTE $CURRENT_BRANCH > /dev/null 2>&1; \
    REMOTE_EXISTS=$?; \
    COMMITS_BEHIND=$(git rev-list --count HEAD..$REMOTE/$CURRENT_BRANCH 2>/dev/null || echo 0); \
    echo ''; \
    echo $LINE_BREAK; \
    echo '          ✨ SUPER DUPER PUSH ✨'; \
    echo $LINE_BREAK; \
    echo ''; \
    echo \"🔍 Branch status:\"; \
    echo $SUB_BREAK; \
    echo \"Current branch: ${BOLD}$CURRENT_BRANCH${RESET}\"; \
    if [ $REMOTE_EXISTS -eq 0 ]; then \
      echo \"Remote status: ${GREEN}✓ exists${RESET} on $REMOTE\"; \
      \
      if [ $UNPUSHED_COMMITS -eq 0 ]; then \
        echo \"${GREEN}✅ Branch is already up to date with remote.${RESET}\"; \
        if [ $COMMITS_BEHIND -gt 0 ]; then \
          echo \"${YELLOW}⚠️ However, your branch is $COMMITS_BEHIND commits behind remote.${RESET}\"; \
          echo \"Consider pulling first: ${BOLD}git pull${RESET}\"; \
        else \
          echo \"No need to push.\"; \
          exit 0; \
        fi; \
      elif [ $UNPUSHED_COMMITS -gt 0 ]; then \
        echo \"Unpushed commits: ${YELLOW}$UNPUSHED_COMMITS${RESET}\"; \
        if [ $COMMITS_BEHIND -gt 0 ]; then \
          if echo \"$@\" | grep -q -- \"--force\"; then \
            echo \"${YELLOW}⚠️ Your branch is $COMMITS_BEHIND commits behind remote.${RESET}\"; \
            echo \"${YELLOW}Continuing with force push as requested.${RESET}\"; \
          else \
            echo \"${YELLOW}⚠️ Your branch is $COMMITS_BEHIND commits behind remote.${RESET}\"; \
            echo \"${BLUE}🔄 Checking if auto-merge is possible...${RESET}\"; \
            \
            MERGE_TEST=$(git merge-tree $(git merge-base HEAD $REMOTE/$CURRENT_BRANCH) HEAD $REMOTE/$CURRENT_BRANCH); \
            if echo \"$MERGE_TEST\" | grep -q \"<<<<<<< \"; then \
              echo \"${RED}❌ Push blocked: Potential merge conflicts detected.${RESET}\"; \
              echo \"Run ${BOLD}git pull${RESET} to manually resolve conflicts first.\"; \
              echo \"Or use ${BOLD}git push --force${RESET} if you're sure (not recommended).\"; \
              exit 1; \
            else \
              echo \"${GREEN}✅ No conflicts detected, auto-merging changes...${RESET}\"; \
              git pull --ff-only >/dev/null 2>&1; \
              PULL_STATUS=$?; \
              if [ $PULL_STATUS -ne 0 ]; then \
                echo \"${YELLOW}⚠️ Fast-forward merge not possible. Trying regular merge...${RESET}\"; \
                git pull --no-edit >/dev/null 2>&1; \
                PULL_STATUS=$?; \
                if [ $PULL_STATUS -ne 0 ]; then \
                  echo \"${RED}❌ Auto-merge failed. Please resolve manually.${RESET}\"; \
                  echo \"Run ${BOLD}git pull${RESET} to resolve conflicts first.\"; \
                  exit 1; \
                else \
                  echo \"${GREEN}✅ Merge successful.${RESET}\"; \
                fi; \
              else \
                echo \"${GREEN}✅ Fast-forward successful.${RESET}\"; \
              fi; \
            fi; \
          fi; \
        fi; \
      fi; \
    else \
      echo \"Remote status: ${BLUE}new branch${RESET} (not yet on $REMOTE)\"; \
      \
      PARENT_BRANCH=$(git show-branch -a 2>/dev/null | grep '\\*' | grep -v \"$CURRENT_BRANCH\" | head -n1 | sed 's/.*\\[\\(.*\\)\\].*/\\1/' | sed 's/[\\^~].*//' || echo \"$MAIN_BRANCH\"); \
      if [ \"$PARENT_BRANCH\" = \"$DEV_BRANCH\" ]; then \
        echo \"${GREEN}✓ Created from ${BOLD}$DEV_BRANCH${RESET}${GREEN} (good practice)${RESET}\"; \
      elif [ \"$PARENT_BRANCH\" = \"$MAIN_BRANCH\" ]; then \
        echo \"${YELLOW}⚠️ Created from ${BOLD}$MAIN_BRANCH${RESET}${YELLOW} (consider using dev branch next time)${RESET}\"; \
      fi; \
    fi; \
    if [ \"$CURRENT_BRANCH\" = \"$MAIN_BRANCH\" ]; then \
      if echo \"$@\" | grep -q -- \"--force\"; then \
        echo \"${RED}⚠️ Force pushing to $MAIN_BRANCH is dangerous!${RESET}\"; \
        echo \"${YELLOW}Continuing as requested, but this is not recommended.${RESET}\"; \
      else \
        echo \"${RED}❌ Push blocked: You are attempting to push to $MAIN_BRANCH!${RESET}\"; \
        echo \"${YELLOW}Create a feature branch instead: ${BOLD}git checkout -b feature-name${RESET}\"; \
        echo \"Use ${BOLD}git push --force${RESET} if you're absolutely sure (not recommended).\"; \
        exit 1; \
      fi; \
    elif [ \"$CURRENT_BRANCH\" = \"$DEV_BRANCH\" ]; then \
      echo \"${YELLOW}⚠️  WARNING: You are pushing to $DEV_BRANCH!${RESET}\"; \
      echo \"${YELLOW}It's generally better to create feature branches.${RESET}\"; \
    fi; \
    echo ''; \
    echo \"🚀 Push plan:\"; \
    echo $SUB_BREAK; \
    if [ -z \"$UPSTREAM\" ] || [ $REMOTE_EXISTS -ne 0 ]; then \
      echo \"Setting up new remote branch '${BOLD}$CURRENT_BRANCH${RESET}'...\"; \
      git push -u $REMOTE $CURRENT_BRANCH \"$@\"; \
      PUSH_STATUS=$?; \
    else \
      echo \"Pushing to existing remote branch '${BOLD}$CURRENT_BRANCH${RESET}'...\"; \
      git push \"$@\"; \
      PUSH_STATUS=$?; \
    fi; \
    echo ''; \
    echo \"📊 Push summary:\"; \
    echo $SUB_BREAK; \
    if [ $PUSH_STATUS -eq 0 ]; then \
      if [ -z \"$UPSTREAM\" ] || [ $REMOTE_EXISTS -ne 0 ]; then \
        echo \"${GREEN}✅ Successfully created and pushed to new branch.${RESET}\"; \
        echo \"Branch '${BOLD}$CURRENT_BRANCH${RESET}' is now tracked on $REMOTE.\"; \
      else \
        echo \"${GREEN}✅ Successfully pushed to existing branch.${RESET}\"; \
      fi; \
      \
      echo ''; \
      echo \"🚦 Current branch status:\"; \
      echo $SUB_BREAK; \
      git status --short | sed 's/^/  /'; \
      \
      echo ''; \
      echo \"🕒 Recent commits:\"; \
      echo $SUB_BREAK; \
      git log -n 3 --oneline --stat | sed 's/^/  /'; \
      \
      if [ \"$CURRENT_BRANCH\" != \"$MAIN_BRANCH\" ] && [ \"$CURRENT_BRANCH\" != \"$DEV_BRANCH\" ]; then \
        echo ''; \
        echo \"📝 Next steps:\"; \
        echo $SUB_BREAK; \
        echo \"${GREEN}✅ Consider creating a Pull Request to merge into $DEV_BRANCH${RESET}\"; \
      fi; \
    else \
      echo \"${RED}❌ Push failed with status code $PUSH_STATUS${RESET}\"; \
      echo ''; \
      echo \"⚠️ Current status:\"; \
      echo $SUB_BREAK; \
      git status | sed 's/^/  /'; \
      echo ''; \
      echo \"Common issues:\"; \
      echo \"  - Remote changes not pulled (try ${BOLD}git pull${RESET} first)\"; \
      echo \"  - Permission issues (check your SSH keys or access token)\"; \
      echo \"  - Branch protection rules (check repository settings)\"; \
    fi; \
  }; f"

  sd-branch = "!f() { \
    CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD); \
    DEV_BRANCH=\"dev\"; \
    MAIN_BRANCH=\"main\"; \
    LINE_BREAK='========================================='; \
    SUB_BREAK='~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~'; \
    GREEN=\"\\033[0;32m\"; \
    YELLOW=\"\\033[0;33m\"; \
    RED=\"\\033[0;31m\"; \
    BLUE=\"\\033[0;34m\"; \
    BOLD=\"\\033[1m\"; \
    RESET=\"\\033[0m\"; \
    FEATURE_BRANCH=\"$1\"; \
    echo ''; \
    echo $LINE_BREAK; \
    echo '        ✨ SUPER DUPER BRANCH ✨'; \
    echo $LINE_BREAK; \
    echo ''; \
    echo '🔍 Current State:'; \
    echo $SUB_BREAK; \
    echo \"Current branch: ${BOLD}$CURRENT_BRANCH${RESET}\"; \
    git rev-parse --verify $MAIN_BRANCH >/dev/null 2>&1; \
    MAIN_EXISTS=$?; \
    if [ $MAIN_EXISTS -ne 0 ]; then \
      MAIN_BRANCH=\"master\"; \
      git rev-parse --verify $MAIN_BRANCH >/dev/null 2>&1; \
      MAIN_EXISTS=$?; \
    fi; \
    git rev-parse --verify $DEV_BRANCH >/dev/null 2>&1; \
    DEV_EXISTS=$?; \
    if [ $MAIN_EXISTS -eq 0 ]; then \
      echo \"Main branch (${BOLD}$MAIN_BRANCH${RESET}): ${GREEN}✓ exists${RESET}\"; \
    else \
      echo \"Main branch: ${RED}✗ missing${RESET}\"; \
    fi; \
    if [ $DEV_EXISTS -eq 0 ]; then \
      echo \"Dev branch (${BOLD}$DEV_BRANCH${RESET}): ${GREEN}✓ exists${RESET}\"; \
    else \
      echo \"Dev branch: ${RED}✗ missing${RESET}\"; \
    fi; \
    echo ''; \
    echo '🚀 Action Plan:'; \
    echo $SUB_BREAK; \
    if [ \"$CURRENT_BRANCH\" = \"$MAIN_BRANCH\" ]; then \
      echo \"${YELLOW}⚠️ You are on $MAIN_BRANCH branch.${RESET}\"; \
      \
      if [ $DEV_EXISTS -ne 0 ]; then \
        echo \"Creating ${BLUE}dev${RESET} branch from ${BLUE}$MAIN_BRANCH${RESET}...\"; \
        git checkout -b $DEV_BRANCH; \
        echo \"${GREEN}✅ Created and switched to dev branch.${RESET}\"; \
        echo ''; \
        \
        if [ ! -z \"$FEATURE_BRANCH\" ]; then \
          echo \"Creating feature branch ${BLUE}$FEATURE_BRANCH${RESET} from ${BLUE}dev${RESET}...\"; \
          git checkout -b \"$FEATURE_BRANCH\"; \
          echo \"${GREEN}✅ Created and switched to feature branch '$FEATURE_BRANCH'.${RESET}\"; \
        else \
          echo \"${YELLOW}ℹ️ Would you like to create a feature branch? Use:${RESET}\"; \
          echo \"  ${BOLD}git sd-branch <feature-branch-name>${RESET}\"; \
        fi; \
      else \
        echo \"Switching to ${BLUE}dev${RESET} branch...\"; \
        git checkout $DEV_BRANCH; \
        echo \"${GREEN}✅ Switched to dev branch.${RESET}\"; \
        echo ''; \
        \
        if [ ! -z \"$FEATURE_BRANCH\" ]; then \
          echo \"Creating feature branch ${BLUE}$FEATURE_BRANCH${RESET} from ${BLUE}dev${RESET}...\"; \
          git checkout -b \"$FEATURE_BRANCH\"; \
          echo \"${GREEN}✅ Created and switched to feature branch '$FEATURE_BRANCH'.${RESET}\"; \
        else \
          echo \"${YELLOW}ℹ️ Would you like to create a feature branch? Use:${RESET}\"; \
          echo \"  ${BOLD}git sd-branch <feature-branch-name>${RESET}\"; \
        fi; \
      fi; \
    elif [ \"$CURRENT_BRANCH\" = \"$DEV_BRANCH\" ]; then \
      echo \"${GREEN}🛠️ You're on dev branch. Good start!${RESET}\"; \
      \
      if [ ! -z \"$FEATURE_BRANCH\" ]; then \
        echo \"Creating feature branch ${BLUE}$FEATURE_BRANCH${RESET} from ${BLUE}dev${RESET}...\"; \
        git checkout -b \"$FEATURE_BRANCH\"; \
        echo \"${GREEN}✅ Created and switched to feature branch '$FEATURE_BRANCH'.${RESET}\"; \
      else \
        echo \"${YELLOW}ℹ️ Would you like to create a feature branch? Use:${RESET}\"; \
        echo \"  ${BOLD}git sd-branch <feature-branch-name>${RESET}\"; \
      fi; \
    else \
      echo \"${BLUE}🧩 You're on branch '$CURRENT_BRANCH'.${RESET}\"; \
      \
      if [ $DEV_EXISTS -eq 0 ]; then \
        MERGE_BASE=$(git merge-base $CURRENT_BRANCH $DEV_BRANCH 2>/dev/null); \
        DEV_COMMIT=$(git rev-parse $DEV_BRANCH 2>/dev/null); \
        \
        if [ \"$MERGE_BASE\" = \"$DEV_COMMIT\" ]; then \
          echo \"${GREEN}✅ This branch appears to be created from dev. Good to go!${RESET}\"; \
          \
          BEHIND_DEV=$(git rev-list --count $CURRENT_BRANCH..$DEV_BRANCH 2>/dev/null || echo \"0\"); \
          if [ \"$BEHIND_DEV\" -gt 0 ]; then \
            echo \"${YELLOW}ℹ️ Your branch is $BEHIND_DEV commit(s) behind dev.${RESET}\"; \
            echo \"  To update: ${BOLD}git merge $DEV_BRANCH${RESET}\"; \
          fi; \
        else \
          echo \"${YELLOW}⚠️ This branch may not have been created from dev.${RESET}\"; \
          \
          if [ ! -z \"$FEATURE_BRANCH\" ]; then \
            echo \"${YELLOW}ℹ️ Would you like to recreate from dev? Run:${RESET}\"; \
            echo \"  ${BOLD}git checkout $DEV_BRANCH && git checkout -b $FEATURE_BRANCH${RESET}\"; \
          elif [ \"$CURRENT_BRANCH\" != \"$FEATURE_BRANCH\" ]; then \
            echo \"${YELLOW}ℹ️ Would you like to recreate from dev? Run:${RESET}\"; \
            echo \"  ${BOLD}git checkout $DEV_BRANCH && git checkout -b $CURRENT_BRANCH${RESET}\"; \
          fi; \
        fi; \
      else \
        echo \"${RED}⚠️ Dev branch not found. Cannot verify branch origin.${RESET}\"; \
        echo \"${YELLOW}ℹ️ Create a dev branch first:${RESET} ${BOLD}git checkout $MAIN_BRANCH && git checkout -b $DEV_BRANCH${RESET}\"; \
      fi; \
    fi; \
    if [ $MAIN_EXISTS -eq 0 ] && [ $DEV_EXISTS -eq 0 ] && [ \"$CURRENT_BRANCH\" != \"$MAIN_BRANCH\" ] && [ \"$CURRENT_BRANCH\" != \"$DEV_BRANCH\" ]; then \
      echo ''; \
      echo '📊 Branch Relationships:'; \
      echo $SUB_BREAK; \
      \
      BEHIND_AHEAD_MAIN=$(git rev-list --left-right --count $MAIN_BRANCH...$CURRENT_BRANCH 2>/dev/null); \
      BEHIND_MAIN=$(echo \"$BEHIND_AHEAD_MAIN\" | awk '{print $1}'); \
      AHEAD_MAIN=$(echo \"$BEHIND_AHEAD_MAIN\" | awk '{print $2}'); \
      \
      BEHIND_AHEAD_DEV=$(git rev-list --left-right --count $DEV_BRANCH...$CURRENT_BRANCH 2>/dev/null); \
      BEHIND_DEV=$(echo \"$BEHIND_AHEAD_DEV\" | awk '{print $1}'); \
      AHEAD_DEV=$(echo \"$BEHIND_AHEAD_DEV\" | awk '{print $2}'); \
      \
      echo \"Relation to $MAIN_BRANCH: $([ $AHEAD_MAIN -gt 0 ] && echo \"${GREEN}$AHEAD_MAIN ahead${RESET}\" || echo \"$AHEAD_MAIN ahead\"), $([ $BEHIND_MAIN -gt 0 ] && echo \"${RED}$BEHIND_MAIN behind${RESET}\" || echo \"$BEHIND_MAIN behind\")\"; \
      echo \"Relation to $DEV_BRANCH: $([ $AHEAD_DEV -gt 0 ] && echo \"${GREEN}$AHEAD_DEV ahead${RESET}\" || echo \"$AHEAD_DEV ahead\"), $([ $BEHIND_DEV -gt 0 ] && echo \"${RED}$BEHIND_DEV behind${RESET}\" || echo \"$BEHIND_DEV behind\")\"; \
    fi; \
    echo ''; \
    echo '📝 Workflow Tip:'; \
    echo $SUB_BREAK; \
    if [ \"$CURRENT_BRANCH\" = \"$MAIN_BRANCH\" ]; then \
      echo \"${RED}❌ Avoid committing directly to $MAIN_BRANCH.${RESET}\"; \
      echo \"${GREEN}✅ Work on feature branches created from dev.${RESET}\"; \
    elif [ \"$CURRENT_BRANCH\" = \"$DEV_BRANCH\" ]; then \
      echo \"${YELLOW}⚠️ Avoid committing directly to dev if possible.${RESET}\"; \
      echo \"${GREEN}✅ Create feature branches from dev for your work.${RESET}\"; \
    else \
      echo \"${GREEN}✅ When finished with this feature branch:${RESET}\"; \
      echo \"  1. Push your branch: ${BOLD}git push -u origin $CURRENT_BRANCH${RESET}\"; \
      echo \"  2. Create a PR to merge into dev\"; \
      echo \"  3. After PR is merged, delete branch: ${BOLD}git branch -d $CURRENT_BRANCH${RESET}\"; \
    fi; \
    echo ''; \
  }; f"